            operationId: get-v2-payout-request-for-quotes
            description:
                This endpoint retrieves a list of payout request-for-quotes. The client can use this endpoint to fetch previously
                request-for-quotes for payout transactions, including details such as the source and destination accounts, and the amount
                to be transferred. This allows clients to review and compare different request-for-quotes before selecting the best option
                for confirming and executing the payout transaction. The endpoint ensures that all provided details are accurate and up-to-date,
                facilitating informed decision-making for transferring funds out of accounts within the `Triple-A` system.
