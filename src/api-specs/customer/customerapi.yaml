openapi: 3.0.0
tags:
    - name: internal-transfer
      description:
          The `internal-transfer` operations handle the transfer of funds between accounts within the same organization
          or different with in `Triple-A` system.
          These operations include requesting quotes for internal transfers, creating new internal transfer quotes,
          and confirming internal transfer quotes. The endpoints ensure that the provided details are valid, calculate
          any applicable fees, and facilitate the secure and efficient transfer of funds between internal accounts.
    - name: payin
      description:
          The `payin` operations manage the process of adding funds to an account within the `Triple-A` system.
          These operations include requesting quotes for pay-in transactions, creating new pay-in quotes,
          and confirming pay-in quotes. The endpoints ensure that the provided details are valid, calculate
          any applicable fees, and facilitate the secure and efficient addition of funds to the specified account.
          Pay-ins can be used for various purposes such as `pre-funding`, `deposits``, or `purchases from merchants of the `Triple-A` system.
    - name: payout
      description:
          The `payout` operations manage the process of transferring funds out of an account within the `Triple-A` system.
          These operations include requesting quotes for payout transactions, creating new payout quotes,
          and confirming payout quotes. The endpoints ensure that the provided details are valid, calculate
          any applicable fees, and facilitate the secure and efficient transfer of funds to the specified destination account.
          Payouts can be used for various purposes such as `withdrawals`, `payments to vendors`,`salary for individual`, or disbursements to external accounts.
    - name: transfer
      description:
          The `transfer` operations handle the movement of funds between different accounts with out parking in the `Triple-A` system.
          These operations include requesting quotes for transfers, creating new transfer quotes,
          and confirming transfer quotes. The endpoints ensure that the provided details are valid, calculate
          any applicable fees, and facilitate the secure and efficient transfer of funds between the specified accounts.
          Transfers can be used for various purposes such as remittances, cross border payments, or moving funds between different accounts[External],
          off-ramp from external wallet, on-ramp to external wallet, etc.
info:
    title: customer api
    version: '2.0'
    description: 'payins, payouts, transfers and internal transfers by Triple-A'
    contact:
        name: contact
        email: contact@triple-a.io
        url: 'https://triple-a.io/contact-us/'
    termsOfService: 'https://triple-a.io/privacy-and-terms-policy/'
    license:
        name: apache 2
        url: 'https://apache.org/licenses/LICENSE-2.0'
servers:
    - url: 'http://localhost:8086'
x-internal: false
paths:
    #####################
    # internal transfer #
    #####################
    /v2/internal-transfer/request-for-quotes:
        post:
            operationId: post-v2-internal-transfer-request-for-quotes
            description:
                This endpoint is used to request for quotes for an internal transfer. The client must provide the necessary details
                such as the source account, destination account, and the amount to be transferred. Upon successful request,
                the response will include unique rfq ID, the details of the internal transfer,
                and any applicable fees. These rfq can then be reviewed to select the best option for creating quote, confirming and executing
                the internal transfer. The endpoint ensures that the provided details are valid and calculates the fees associated
                with the transaction.
            tags:
                - internal-transfer
            parameters:
                - $ref: ../common.yaml#/components/parameters/X-Idempotency-Key
            requestBody:
                $ref: '#/components/requestBodies/internal-transfer-request-for-quote-req'
            responses:
                '201':
                    $ref: '#/components/responses/internal-transfer-request-for-quote-resp'
                '400':
                    $ref: '#/components/responses/problem-detail'
                '500':
                    $ref: '#/components/responses/problem-detail'
        get:
            operationId: get-v2-internal-transfer-request-for-quotes
            description:
                This endpoint retrieves a list of request-for-quotes for internal transfer requests. The client can use this endpoint
                to fetch previously request-for-quotes for internal transfers, including details such as the source and destination
                accounts, the amount to be transferred, and any applicable fees. This allows clients to review and compare
                different quotes before selecting the best option for confirming and executing the internal transfer.
                The endpoint ensures that all provided details are accurate and up-to-date, facilitating informed decision-making
                for internal fund transfers within the `Triple-A` system.
            tags:
                - internal-transfer
            responses:
                '200':
                    $ref: '#/components/responses/internal-transfer-request-for-quote-list-resp'
    '/v2/internal-transfer/request-for-quotes/{internal-transfer-request-for-quote-id}':
        parameters:
            - $ref: ../quotes.yaml#/components/parameters/internal-transfer-request-for-quote-id
        get:
            operationId: get-v2-internal-transfer-request-for-quote
            description:
                This endpoint retrieves the details of a specific internal transfer request-for-quote. The client must provide
                the `internal-transfer-request-for-quote-id` as a path parameter. Upon successful request, the response will include
                detailed information about the requested internal transfer quote, such as the source and destination accounts,
                the amount to be transferred, and any applicable fees. This allows clients to review the specifics of a particular
                internal transfer request-for-quote, ensuring that all provided details are accurate and up-to-date for informed
                decision-making within the `Triple-A` system.
            tags:
                - internal-transfer
            responses:
                '200':
                    $ref: '#/components/responses/internal-transfer-request-for-quote-resp'
    /v2/internal-transfer/quotes:
        post:
            operationId: post-v2-internal-transfer-quotes
            description: This endpoint is used to request a quote for an internal transfer.
                The client must provide the necessary details such as the source and destination accounts,
                and the amount to be transferred. Upon successful request, the response will include a quote ID,
                the details of the transfer, and any applicable fees. This quote can then be used to confirm and
                execute the transfer.
            tags:
                - internal-transfer
            parameters:
                - $ref: ../common.yaml#/components/parameters/X-Idempotency-Key
            requestBody:
                $ref: '#/components/requestBodies/internal-transfer-quote-req'
            responses:
                '201':
                    $ref: '#/components/responses/internal-transfer-quote-resp'
                '400':
                    $ref: '#/components/responses/problem-detail'
                '500':
                    $ref: '#/components/responses/problem-detail'
        get:
            operationId: get-v2-internal-transfer-quotes
            description:
                This endpoint retrieves a list of internal transfer quotes. The client can use this endpoint to fetch previously
                created quotes for internal transfers, including details such as the source and destination accounts, the amount
                to be transferred, the status of each quote, and the validity period (valid until date). This allows clients to review
                and compare different quotes before selecting the best option for confirming and executing the internal transfer.
                The endpoint ensures that all provided details are accurate and up-to-date, facilitating informed decision-making
                for internal fund transfers within the `Triple-A` system.
            tags:
                - internal-transfer
            responses:
                '200':
                    $ref: '#/components/responses/internal-transfer-quote-list-resp'
    '/v2/internal-transfer/quotes/{internal-transfer-quote-id}':
        parameters:
            - $ref: ../quotes.yaml#/components/parameters/internal-transfer-quote-id
        get:
            operationId: get-v2-internal-transfer-quote
            description:
                This endpoint retrieves the details of a specific internal transfer quote. The client must provide
                the `internal-transfer-quote-id` as a path parameter. Upon successful request, the response will include
                detailed information about the internal transfer quote, such as the source and destination accounts,
                the amount to be transferred, the status of the quote, and the validity period (valid until date).
                This allows clients to review the specifics of a particular internal transfer quote, ensuring that all provided
                details are accurate and up-to-date for informed decision-making within the `Triple-A` system.
            tags:
                - internal-transfer
            responses:
                '200':
                    $ref: '#/components/responses/internal-transfer-quote-resp'
    '/v2/internal-transfer/quotes/{internal-transfer-quote-id}/confirm':
        parameters:
            - $ref: ../quotes.yaml#/components/parameters/internal-transfer-quote-id
        post:
            operationId: post-v2-internal-transfer-quotes-confirm
            description:
                This endpoint confirms an internal transfer quote. The client must provide the `internal-transfer-quote-id`
                as a path parameter. Upon successful confirmation, the response will include the details of the confirmed
                internal transfer, including the source and destination accounts, the status of the quote, and any applicable
                transaction fees. This confirmation finalizes the quote and prepares it for execution.
            tags:
                - internal-transfer
            parameters:
                - $ref: ../common.yaml#/components/parameters/X-Idempotency-Key
            responses:
                '200':
                    $ref: '#/components/responses/internal-transfer-quote-resp'
                '400':
                    $ref: '#/components/responses/problem-detail'
                '500':
                    $ref: '#/components/responses/problem-detail'

