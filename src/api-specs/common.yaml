openapi: 3.0.0
info:
    title: common definitions
    version: '1.0'
    description: common definitions
    contact:
        name: contact
        email: contact@triple-a.io
        url: 'https://triple-a.io/contact-us/'
    termsOfService: 'https://triple-a.io/privacy-and-terms-policy/'
    license:
        name: apache 2
        url: 'https://apache.org/licenses/LICENSE-2.0'
paths:
    /dummy:
        get:
            summary: Dummy endpoint to satisfy OpenAPI validator
            responses:
                '200':
                    description: Successful response
components:
    schemas:
        ProblemDetail:
            title: ProblemDetail
            type: object
            x-go-type: httpapi.ProblemDetail
            description: RFC9457
            required:
                - type
                - title
                - detail
                - instance
            properties:
                type:
                    type: string
                    example: 'https://example.com/probs/out-of-credit'
                    maxLength: 2000
                    minLength: 0
                title:
                    type: string
                    example: You do not have enough credit.
                    minLength: 0
                    maxLength: 1000
                detail:
                    type: string
                    example: 'Your current balance is 30, but that costs 50.'
                    minLength: 0
                    maxLength: 1000
                instance:
                    type: string
                    example: /account/12345/msgs/abc
                    minLength: 0
                    maxLength: 1000
            x-examples:
                out of credit:
                    type: 'https://example.com/probs/out-of-credit'
                    title: You do not have enough credit.
                    detail: 'Your current balance is 30, but that costs 50.'
                    instance: /account/12345/msgs/abc
        VirtualAccount:
            title: VirtualAccount
            type: object
            x-go-type: account.VirtualAccount
            properties:
                id:
                    $ref: '#/components/schemas/AccountID'
                label:
                    $ref: '#/components/schemas/Label'
                network_currency_id:
                    $ref: './money.yaml#/components/schemas/NetworkCurrencyID'
                balance:
                    $ref: '#/components/schemas/Decimal'
                account_category:
                    $ref: '#/components/schemas/AccountCategory'
                account_locality:
                    $ref: '#/components/schemas/AccountLocality'
                created_at:
                    $ref: '#/components/schemas/Datetime'
        AccountCategory:
            title: AccountCategory
            type: string
            x-go-type: accountcategory.Category
            enum:
                - bank_account
                - crypto_account
                - virtual_account
            example:
                - bank_account
        AccountLocality:
            title: AccountLocality
            type: string
            x-go-type: accountlocality.Locality
            enum:
                - internal
                - external
            example:
                - internal
        AccountID:
            title: account id
            type: string
            x-go-type: id.AccountID
            pattern: ^lacc-
            example: lacc-01j6pe0975kztejnkzrd0q1hax
            description: account id on the ledger
            minLength: 31
            maxLength: 31
        ExtAccountID:
            title: external account id
            type: string
            x-go-type: id.AccountID
            pattern: ^xlacc-
            example: xlacc-01j6pe0975kztejnkzrd0q1hax
            description: account id on the ledger for external accounts
            minLength: 32
            maxLength: 32
        AccountDetails:
            title: AccountDetails
            description: details of the account
            type: object
            x-go-type: ledger.AccountDetails
            properties:
                id:
                    $ref: '#/components/schemas/AccountID'
                network_currency_id:
                    $ref: './money.yaml#/components/schemas/NetworkCurrencyID'
                label:
                    type: string
                    example: my EUR account
                    minLength: 0
                    maxLength: 100
                balance:
                    $ref: '#/components/schemas/Decimal'
                transactions:
                    type: array
                    items:
                        $ref: '#/components/schemas/LedgerTransaction'
        EntityType:
            title: entity type
            type: string
            enum:
                - individual
                - corporate
        IndividualEntity:
            title: Individual entity
            type: object
            x-go-type: entity.IndividualEntity
            properties:
                id:
                    $ref: '#/components/schemas/EntityID'
                name:
                    type: string
                    example: Joshuah Grant
                email:
                    type: string
                    format: email
                    example: Flavio_Cartwright37@gmail.com
                created_at:
                    $ref: '#/components/schemas/Datetime'
                gender:
                    $ref: '#/components/schemas/Gender'
                first_name:
                    type: string
                    example: Joshuah
                last_name:
                    type: string
                    example: Grant
                street:
                    type: string
                    example: '9 Jurong Town Hall Rd #01-50 iHub S()'
                city:
                    type: string
                    example: singapore
                postal_code:
                    type: string
                    example: '609431'
                country:
                    $ref: '#/components/schemas/CountryCode2'
                nationality:
                    $ref: '#/components/schemas/CountryCode2'
                birth_country:
                    $ref: '#/components/schemas/CountryCode2'
                birth_date:
                    $ref: '#/components/schemas/Date'
                birth_place:
                    type: string
                    example: paris
                entity_type:
                    $ref: '#/components/schemas/EntityType'
        CorporateEntity:
            title: corporate entity
            type: object
            x-go-type: entity.CorporateEntity
            properties:
                id:
                    $ref: '#/components/schemas/EntityID'
                name:
                    type: string
                    example: Wisoky - Berge
                email:
                    type: string
                    format: email
                    example: mercedes_oconner@yahoo.com
                created_at:
                    $ref: '#/components/schemas/Datetime'
                street:
                    type: string
                    example: '160 Lor 1 Toa Payoh #01-1564'
                city:
                    type: string
                    example: singapore
                postal_code:
                    type: string
                    example: '310160'
                country:
                    $ref: '#/components/schemas/CountryCode2'
                company_name:
                    type: string
                    example: Wisoky - Berge
                registration_country:
                    $ref: '#/components/schemas/CountryCode2'
                incorporation_date:
                    $ref: '#/components/schemas/Date'
                entity_type:
                    $ref: '#/components/schemas/EntityType'
        EntityID:
            title: EntityID
            type: string
            x-go-type: id.EntityID
            pattern: ^ent-
            example: ent-ykrit3642ha2gzdthfagghbnme
            description: entity id
            minLength: 30
            maxLength: 30
        Label:
            title: Label
            type: string
            pattern: '^[A-Za-z0-9_.\- '']+$'
            example: euro iban
            description: label
            minLength: 0
            maxLength: 300
        LegalEntityCorporate:
            title: LegalEntityCorporate
            type: object
            x-go-type: legalentity.CorporateLegalEntity
            properties:
                id:
                    type: string
                    example: legent-01hzy23cq44ae6k7vy5jtp8bef #pragma: allowlist secret
                entity_type:
                    type: string
                    enum:
                        - corporate
                company_name:
                    type: string
                    example: Example Corp
