            in: query
            required: false
            schema:
                type: integer
                example: 10
            description: number of records to be returned
        starting_after:
            name: starting_after
            in: query
            required: false
            schema:
                type: string
                example: legent-01hzy23cq44ae6k7vy5jtp8bef #pragma: allowlist secret
            description: last id of the current list to fetch the next page
        ending_before:
            name: ending_before
            in: query
            required: false
            schema:
                type: string
                example: legent-01hzy23cq44ae6k7vy5jtp8bef #pragma: allowlist secret
            description: first id of the current list to fetch the previous page
