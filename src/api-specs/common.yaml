                    type: boolean
                    default: false
                created_at:
                    $ref: '#/components/schemas/Datetime'
        Transaction:
            title: Transaction
            type: object
            description: transaction
            x-go-type: businesstransaction.BusinessTransaction
            properties:
                id:
                    type: string
                from_account_id:
                    $ref: '#/components/schemas/AccountID'
                to_account_id:
                    $ref: '#/components/schemas/AccountID'
                amount:
                    $ref: '#/components/schemas/Decimal'
                created_at:
                    $ref: '#/components/schemas/Datetime'
        BusinessID:
            title: BusinessID
            type: string
            x-go-type: string
            pattern: '^[a-z]*-'
            example: ope-ykrit3642ha2gzdthfagghbnme
            description: business operation id
            minLength: 30
            maxLength: 40
        Balance:
            x-go-type: account.Balance
