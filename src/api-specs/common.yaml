                pending_balance:
                    $ref: '#/components/schemas/Decimal'
        CalVersioning:
            type: string
            example: v2024.06.25.2230
            pattern: '^v\d{4}\.\d{2}\.\d{2}\.\d{4}$'
        BankNetwork:
