        MedianFxRateV1:
            title: MedianFxRateV1
            type: object
            x-go-type: rate.MedianFxRateV1
            description: rates with complete descriptions
            required:
                - id
                - version
                - providers_contrib
                - providers_medians
                - rates_count
                - outliers_perc
                - created_at
                - rate
            properties:
                id:
                    $ref: '#/components/schemas/UUID'
                version:
                    type: integer
                    example: 1
                    format: int32
                    maximum: 1000
                    minimum: 0
                base:
                    $ref: './money.yaml#/components/schemas/CurrencyCode'
                quote:
                    $ref: './money.yaml#/components/schemas/CurrencyCode'
                rate_base_quote:
                    $ref: '#/components/schemas/Decimal'
                rate_base_usd:
                    $ref: '#/components/schemas/Decimal'
                rate_usd_quote:
                    $ref: '#/components/schemas/Decimal'
                providers_contrib:
                    type: object
                    example:
                        provider1: 5
                        provider2: 3
                    additionalProperties:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 2000000
                        example: 1
                providers_medians:
                    type: object
                    example:
                        provider1: '5'
                        provider2: '3'
                    additionalProperties:
                        $ref: '#/components/schemas/Decimal'
                rates_count:
                    type: integer
                    example: 100
                    minimum: 0
                    format: int64
                    maximum: 1000000
                outliers_perc:
                    type: integer
                    example: 5
                    maximum: 100
                    minimum: 0
                    format: int32
                created_at:
                    $ref: '#/components/schemas/Datetime'
            example:
                - id: 018ffbf3-8fe6-7b4d-b7a3-20a87a989470
                  version: 1
                  providers_contrib:
                      bitfinex: 4
                      coinbase: 40
                      kraken: 1
                  providers_medians:
                      bitfinex: '0.6666'
                      coinbase: '0.7777'
                      kraken: '0.88888'
                  rates_count: 45
                  outliers_perc: 0
                  created_at: '2024-06-09T07:43:13.812496278Z'
                  base: SOL
                  quote: USD
                  rate_base_quote: '159.46'
                  rate_base_usd: '159.46'
                  rate_usd_quote: '0.0062711651824909'
        Rates:
            title: Rates
            type: object
            x-go-type: rate.CurrencyRates
            description: rates map
            example:
                - SOL:
                      id: 018ffbf3-8fe6-7b4d-b7a3-20a87a989470
                      version: 1
                      providers_contrib:
