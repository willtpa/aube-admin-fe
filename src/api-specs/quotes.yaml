openapi: 3.0.0
info:
    title: common quotes/rfqs definitions
    version: '1.0'
    description: common quotes/rfqs definitions
    contact:
        name: contact
        email: contact@triple-a.io
        url: 'https://triple-a.io/contact-us/'
    termsOfService: 'https://triple-a.io/privacy-and-terms-policy/'
    license:
        name: apache 2
        url: 'https://apache.org/licenses/LICENSE-2.0'
paths:
    /dummy:
        get:
            operationId: get-dummy
            summary: Dummy endpoint to satisfy OpenAPI validator
            responses:
                '200':
                    description: Successful response
components:
    schemas:
        # Common
        # Quote account details
        QuoteAccountDetails:
            type: object
            properties:
                account:
                    oneOf:
                        - $ref: './common.yaml#/components/schemas/AccountID'
                        - $ref: './money.yaml#/components/schemas/FIATCurrencyCode'
                        - $ref: './money.yaml#/components/schemas/CryptoAssetCode'
                amount:
                    $ref: ./common.yaml#/components/schemas/Decimal
        # Quote ext account
        QuoteExtAccountDetails:
            type: object
            properties:
                account:
                    oneOf:
                        - $ref: './common.yaml#/components/schemas/ExtAccountID'
                        - $ref: '#/components/schemas/QuoteCryptoAccount'
                        - $ref: '#/components/schemas/QuoteBankAccount'
                amount:
                    $ref: ./common.yaml#/components/schemas/Decimal
        QuoteCryptoAccount:
            title: crypto address
            type: object
            required:
                - type
                - network_currency_id
            properties:
                type:
                    type: string
                    enum:
                        - crypto
                network_currency_id:
                    oneOf:
                        - $ref: ./money.yaml#/components/schemas/CryptoNetworkCurrencyID
                        - $ref: ./money.yaml#/components/schemas/TestCryptoNetworkCurrencyID
        QuoteBankAccount:
            title: 'bank account'
            type: object
            required:
                - type
                - currency_code
            properties:
                type:
                    type: string
                    enum:
                        - bank
                currency_code:
                    $ref: './money.yaml#/components/schemas/FIATCurrencyCode'
                country:
                    $ref: ./common.yaml#/components/schemas/CountryCode2
                bank_network:
                    $ref: ./common.yaml#/components/schemas/BankNetwork
        QuoteStatus:
            title: QuoteStatus
            enum:
                - created
                - estimated
                - confirmed
            # Transactions fees
        TransactionFeesSplit:
            type: object
            properties:
                paid_by:
                    $ref: '#/components/schemas/PaidBy'
                payer_fees:
                    type: string
                    example: '0.01'
                recipient_fees:
                    type: string
                    example: '0.01'
        PaidBy:
            title: paid_by
            enum:
                - payer_fees
                - recipient_fees
            ####################
            # InternalTransfer #
            ####################
        InternalTransferRequestForQuoteRequest:
            title: internal transfer request for quote
            type: object
            required:
                - source
                - destination
            properties:
                source:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteAccountDetails'
        InternalTransferRequestForQuoteId:
            title: internal transfer request_for_quote_id
            type: string
            example: int-xfer-rfq-01j6pe0975kztejnkzrd0q1hax
            pattern: ^int-xfer-rfq-
            minLength: 39
            maxLength: 39
        InternalTransferRequestForQuote:
            title: internal_transfer_request_for_quote
            type: object
            required:
                - id
                - source
                - destination
            properties:
                id:
                    $ref: '#/components/schemas/InternalTransferRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        InternalTransferQuoteRequest:
            title: internal_transfer_request_for_quote_request
            type: object
            properties:
                account:
                    oneOf:
                        - title: request for quote id
                          type: object
                          required:
                              - request_for_quote_id
                          properties:
                              request_for_quote_id:
                                  $ref: '#/components/schemas/InternalTransferRequestForQuoteId'
                        - $ref: '#/components/schemas/InternalTransferRequestForQuoteRequest'
        InternalTransferQuoteId:
            title: internal transfer quote_id
            type: string
            example: int-xfer-quo-01j6pe0975kztejnkzrd0q1hax
            pattern: ^int-xfer-quo-
            minLength: 39
            maxLength: 39
        DepositAccount:
            title: transfer_request_for_quote_request
            type: object
            properties:
                account:
                    oneOf:
                        - $ref: ./common.yaml#/components/schemas/BankAccount
                        - $ref: ./common.yaml#/components/schemas/CryptoAccount
        InternalTransferQuote:
            title: internal transfer quote
            type: object
            required:
                - quote_id
                - rfq_id
                - source
                - destination
                - status
            properties:
                quote_id:
                    $ref: '#/components/schemas/InternalTransferQuoteId'
                rfq_id:
                    $ref: '#/components/schemas/InternalTransferRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                destination:
                    type: object
                    $ref: '#/components/schemas/QuoteAccountDetails'
                status:
                    $ref: '#/components/schemas/QuoteStatus'
                valid_until:
                    $ref: ./common.yaml#/components/schemas/Datetime
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        ############
        # Transfer #
        ############
        TransferRequestForQuoteRequest:
            title: transfer_request_for_quote
            type: object
            required:
                - source
                - destination
            properties:
                source:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
        TransferRequestForQuoteId:
            title: transfer request_for_quote_id
            type: string
            example: xfer-rfq-01j6pe0975kztejnkzrd0q1hax
            pattern: ^xfer-rfq-
            minLength: 35
            maxLength: 35
        TransferRequestForQuote:
            title: transfer_request_for_quote
            type: object
            required:
                - id
                - source
                - destination
            properties:
                id:
                    $ref: '#/components/schemas/TransferRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        TransferQuoteRequest:
            title: transfer_request_for_quote_request
            type: object
            properties:
                account:
                    oneOf:
                        - $ref: '#/components/schemas/TransferRequestForQuoteId'
                        - $ref: '#/components/schemas/TransferRequestForQuoteRequest'
        TransferQuoteId:
            title: transfer quote_id
            type: string
            example: xfer-quo-01j6pe0975kztejnkzrd0q1hax
            pattern: ^xfer-quo-
            minLength: 35
            maxLength: 35
        TransferQuote:
            title: transfer quote
            type: object
            required:
                - quote_id
                - rfq_id
                - source
                - destination
                - status
            properties:
                quote_id:
                    $ref: '#/components/schemas/TransferQuoteId'
                rfq_id:
                    $ref: '#/components/schemas/TransferRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                destination:
                    type: object
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                deposit_account:
                    $ref: '#/components/schemas/DepositAccount'
                status:
                    $ref: '#/components/schemas/QuoteStatus'
                valid_until:
                    $ref: ./common.yaml#/components/schemas/Datetime
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        #########
        # Payin #
        #########
        PayinRequestForQuoteRequest:
            title: payin_request_for_quote
            type: object
            required:
                - source
                - destination
            properties:
                source:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteAccountDetails'
        PayinRequestForQuoteId:
            title: payin request_for_quote_id
            type: string
            example: payin-rfq-01j6pe0975kztejnkzrd0q1hax
            pattern: ^payin-rfq-
            minLength: 35
            maxLength: 35
        PayinRequestForQuote:
            title: payin_request_for_quote
            type: object
            required:
                - id
                - source
                - destination
            properties:
                id:
                    $ref: '#/components/schemas/PayinRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        PayinQuoteRequest:
            title: payin_request_for_quote_request
            type: object
            properties:
                account:
                    oneOf:
                        - $ref: '#/components/schemas/PayinRequestForQuoteId'
                        - $ref: '#/components/schemas/PayinRequestForQuoteRequest'
        PayinQuoteId:
            title: payin quote_id
            type: string
            example: payin-quo-01j6pe0975kztejnkzrd0q1hax
            pattern: ^payin-quo-
            minLength: 35
            maxLength: 35
        PayinQuote:
            title: payin quote
            type: object
            required:
                - quote_id
                - rfq_id
                - source
                - destination
                - status
            properties:
                quote_id:
                    $ref: '#/components/schemas/PayinQuoteId'
                rfq_id:
                    $ref: '#/components/schemas/PayinRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                destination:
                    type: object
                    $ref: '#/components/schemas/QuoteAccountDetails'
                deposit_account:
                    $ref: '#/components/schemas/DepositAccount'
                status:
                    $ref: '#/components/schemas/QuoteStatus'
                valid_until:
                    $ref: ./common.yaml#/components/schemas/Datetime
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        ##########
        # Payout #
        ##########
        PayoutRequestForQuoteRequest:
            title: payout_request_for_quote
            type: object
            required:
                - source
                - destination
            properties:
                source:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
        PayoutRequestForQuoteId:
            title: payout request_for_quote_id
            type: string
            example: payout-rfq-01j6pe0975kztejnkzrd0q1hax
            pattern: ^payout-rfq-
            minLength: 36
            maxLength: 36
        PayoutRequestForQuote:
            title: payout_request_for_quote
            type: object
            required:
                - id
                - source
                - destination
            properties:
                id:
                    $ref: '#/components/schemas/PayoutRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                destination:
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
        PayoutQuoteRequest:
            title: payout_request_for_quote_request
            type: object
            properties:
                account:
                    oneOf:
                        - $ref: '#/components/schemas/PayoutRequestForQuoteId'
                        - $ref: '#/components/schemas/PayoutRequestForQuoteRequest'
        PayoutQuoteId:
            title: payout quote_id
            type: string
            example: payout-quo-01j6pe0975kztejnkzrd0q1hax
            pattern: ^payout-quo-
            minLength: 36
            maxLength: 36
        PayoutQuote:
            title: payout quote
            type: object
            required:
                - quote_id
                - rfq_id
                - source
                - destination
                - status
            properties:
                quote_id:
                    $ref: '#/components/schemas/PayoutQuoteId'
                rfq_id:
                    $ref: '#/components/schemas/PayoutRequestForQuoteId'
                source:
                    $ref: '#/components/schemas/QuoteAccountDetails'
                destination:
                    type: object
                    $ref: '#/components/schemas/QuoteExtAccountDetails'
                status:
                    $ref: '#/components/schemas/QuoteStatus'
                valid_until:
                    $ref: ./common.yaml#/components/schemas/Datetime
                transaction_fees_split:
                    $ref: '#/components/schemas/TransactionFeesSplit'
    parameters:
        #####################
        # internal transfer #
        #####################
        internal-transfer-request-for-quote-id:
            name: internal-transfer-request-for-quote-id
            description: internal-transfer-request-for-quote-id
            schema:
                $ref: '#/components/schemas/InternalTransferRequestForQuoteId'
            in: path
            required: true
        internal-transfer-quote-id:
            name: internal-transfer-quote-id
            description: internal-transfer-quote-id
            schema:
                $ref: '#/components/schemas/InternalTransferQuoteId'
            in: path
            required: true
        ############
        # transfer #
        ############
        transfer-request-for-quote-id:
            name: transfer-request-for-quote-id
            description: transfer-request-for-quote-id
            schema:
                $ref: '#/components/schemas/TransferRequestForQuoteId'
            in: path
            required: true
        transfer-quote-id:
            name: transfer-quote-id
            description: transfer-quote-id
            schema:
                $ref: '#/components/schemas/TransferQuoteId'
            in: path
            required: true
        #########
        # payin #
        #########
        payin-request-for-quote-id:
            name: payin-request-for-quote-id
            description: payin-request-for-quote-id
            schema:
                $ref: '#/components/schemas/PayinRequestForQuoteId'
            in: path
            required: true
        payin-quote-id:
            name: payin-quote-id
            description: payin-quote-id
            schema:
                $ref: '#/components/schemas/PayinQuoteId'
            in: path
            required: true
        ##########
        # payout #
        ##########
        payout-request-for-quote-id:
            name: payout-request-for-quote-id
            description: payout-request-for-quote-id
            schema:
                $ref: '#/components/schemas/PayoutRequestForQuoteId'
            in: path
            required: true
        payout-quote-id:
            name: payout-quote-id
            description: payout-quote-id
            schema:
                $ref: '#/components/schemas/PayoutQuoteId'
            in: path
            required: true
    requestBodies:
        #####################
        # internal transfer #
        #####################
        internal-transfer-request-for-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/InternalTransferRequestForQuoteRequest'
            description: |
                information necessary to request for quotes
        internal-transfer-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/InternalTransferQuoteRequest'
            description: |
                information necessary to generate a quote from a request for quote
        ############
        # transfer #
        ############
        transfer-request-for-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/TransferRequestForQuoteRequest'
            description: |
                information necessary to request for quotes
        transfer-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/TransferQuoteRequest'
            description: |
                information necessary to generate a quote from a request for quote
        #########
        # payin #
        #########
        payin-request-for-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/PayinRequestForQuoteRequest'
            description: |
                information necessary to request for quotes
        payin-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/PayinQuoteRequest'
            description: |
                information necessary to generate a quote from a request for quote
        ##########
        # payout #
        ##########
        payout-request-for-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/PayoutRequestForQuoteRequest'
            description: |
                information necessary to request for quotes
        payout-quote:
            content:
                application/json:
                    schema:
                        type: object
                        $ref: '#/components/schemas/PayoutQuoteRequest'
            description: |
                information necessary to generate a quote from a request for quote
    responses:
        #####################
        # Internal transfer #
        #####################
        internal-transfer-request-for-quote:
            description: internal transfer request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/InternalTransferRequestForQuote'
        internal-transfer-request-for-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/InternalTransferRequestForQuote'
        internal-transfer-quote:
            description: internal transfer request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/InternalTransferQuote'
        internal-transfer-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/InternalTransferQuote'
        ############
        # transfer #
        ############
        transfer-request-for-quote:
            description: request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/TransferRequestForQuote'
        transfer-request-for-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TransferRequestForQuote'
        transfer-quote:
            description: request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/TransferQuote'
        transfer-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TransferQuote'
        #########
        # payin #
        #########
        payin-request-for-quote:
            description: request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/PayinRequestForQuote'
        payin-request-for-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PayinRequestForQuote'
        payin-quote:
            description: request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/PayinQuote'
        payin-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PayinQuote'
        #########
        # payout #
        #########
        payout-request-for-quote:
            description: request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/PayoutRequestForQuote'
        payout-request-for-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PayoutRequestForQuote'
        payout-quote:
            description: request for quote
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/PayoutQuote'
        payout-quote-list:
            description: "'a list of request for quotes'"
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            has_more:
                                type: boolean
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/PayoutQuote'
